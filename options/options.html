<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinkedIn Job Saver — Options</title>
  <style>
    body { font: 14px/1.5 "Segoe UI", Arial, sans-serif; margin: 24px auto; max-width: 1100px; color: #1f1f1f; }
    h1 { margin-top: 0; }
    h2 { margin-top: 24px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    button { padding: 8px 14px; border: 1px solid #0a66c2; background: #0a66c2; color: #fff; border-radius: 4px; cursor: pointer; font: inherit; }
    button:hover { background: #004182; }
    button.danger { background: #fff; color: #b00020; border-color: #b00020; }
    button.danger:hover { background: #fee; }
    button.ghost { background: #fff; color: #0a66c2; }
    button.ghost:hover { background: #e8f1fb; }
    /* Compact action buttons in tables */
    td button { padding: 4px 10px; font-size: 12px; margin-right: 4px; }
    td button.ghost { border: 1px solid #0a66c2; }
    td button.danger { border: 1px solid #b00020; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { background: #f7f9fa; position: sticky; top: 0; }
    .desc { max-width: 380px; max-height: 120px; overflow: auto; white-space: pre-wrap; font-size: 12px; background: #f7f9fa; padding: 6px; border-radius: 4px; }
    .count { color: #666; }
    .ids { font-size: 11px; color: #999; }
    .repost { color: #b00020; font-weight: 600; }

    /* Preview modal */
    .modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; }
    .modal[hidden] { display: none; }
    .modal__backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
    .modal__card {
      position: relative;
      background: #fff;
      max-width: 820px;
      width: 100%;
      max-height: calc(100vh - 64px);
      overflow: auto;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,.3);
      padding: 24px 28px 32px;
    }
    .modal__close {
      position: absolute; top: 12px; right: 14px;
      border: none; background: transparent; font: 600 18px/1 Arial, sans-serif;
      cursor: pointer; color: #888; padding: 4px 8px; border-radius: 4px;
    }
    .modal__close:hover { background: #f0f0f0; color: #333; }
    .pv-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; color: #0a66c2; }
    .pv-company { font-size: 15px; color: #555; margin: 0 0 6px; }
    .pv-meta { display: flex; gap: 14px; flex-wrap: wrap; color: #777; font-size: 13px; margin-bottom: 8px; }
    .pv-meta .pv-status { font-weight: 600; }
    .pv-status--apply { color: #057642; }
    .pv-status--to-consider { color: #915907; }
    .pv-status--german { color: #0a66c2; }
    .pv-status--ignored { color: #6b6b6b; }
    .pv-url { font-size: 12px; }
    .pv-url a { color: #0a66c2; }
    .pv-toolbar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .pv-toolbar button { padding: 6px 12px; border: 1px solid #0a66c2; background: #0a66c2; color: #fff; border-radius: 4px; cursor: pointer; font: inherit; }
    .pv-toolbar button.ghost { background: #fff; color: #0a66c2; }
    .pv-toolbar button:hover { background: #004182; color: #fff; }
    .pv-toolbar button.ghost:hover { background: #eef2f5; color: #0a66c2; }
    .pv-desc { margin-top: 16px; line-height: 1.6; color: #1f1f1f; }
    .pv-desc h1, .pv-desc h2, .pv-desc h3 { color: #1f1f1f; margin-top: 18px; }
    .pv-desc p { margin: 10px 0; }
    .pv-desc ul, .pv-desc ol { margin: 10px 0; padding-left: 22px; }
    .pv-desc li { margin: 4px 0; }
    .pv-desc strong { color: #000; }
    .pv-desc br { display: block; content: ""; margin-top: 6px; }
    .pv-empty { color: #999; font-style: italic; padding: 20px 0; }
  </style>
</head>
<body>
  <h1>LinkedIn Job Saver</h1>

  <h2>Saved jobs</h2>
  <p class="count" id="saved-count"></p>
  <div class="toolbar">
    <input id="search-saved" type="search" placeholder="Search saved…" />
    <select id="filter-status-saved" style="padding:8px;border:1px solid #ccc;border-radius:4px;font:inherit;">
      <option value="">All statuses</option>
      <option value="apply">Apply</option>
      <option value="to-consider">Consider</option>
      <option value="german">German</option>
      <option value="ignored">Ignored</option>
      <option value="__none__">No status</option>
    </select>
    <select id="filter-wp-saved" style="padding:8px;border:1px solid #ccc;border-radius:4px;font:inherit;">
      <option value="">All workplaces</option>
      <option value="remote">Remote</option>
      <option value="hybrid">Hybrid</option>
      <option value="onsite">On-site</option>
      <option value="__none__">No workplace</option>
    </select>
    <button id="export-json">Export JSON (saved + seen)</button>
    <button id="export-csv">Export CSV (saved)</button>
    <button id="import-json" class="ghost">Import JSON</button>
    <input id="import-file" type="file" accept="application/json" hidden />
    <button id="clear-saved" class="danger">Clear saved</button>
  </div>
  <table id="table-saved">
    <thead>
      <tr><th>Title</th><th>Company</th><th>Location</th><th>Workplace</th><th>City</th><th>Status</th><th>Saved</th><th>Description (excerpt)</th><th></th></tr>
    </thead>
    <tbody id="rows-saved"></tbody>
  </table>

  <h2>Seen jobs <span style="font-weight:normal;font-size:12px;color:#777">(auto-registered, repost detection)</span></h2>
  <p class="count" id="seen-count"></p>
  <div class="toolbar">
    <input id="search-seen" type="search" placeholder="Search seen…" />
    <select id="filter-status-seen" style="padding:8px;border:1px solid #ccc;border-radius:4px;font:inherit;">
      <option value="">All statuses</option>
      <option value="apply">Apply</option>
      <option value="to-consider">Consider</option>
      <option value="german">German</option>
      <option value="ignored">Ignored</option>
      <option value="__none__">No status</option>
    </select>
    <select id="filter-wp-seen" style="padding:8px;border:1px solid #ccc;border-radius:4px;font:inherit;">
      <option value="">All workplaces</option>
      <option value="remote">Remote</option>
      <option value="hybrid">Hybrid</option>
      <option value="onsite">On-site</option>
      <option value="__none__">No workplace</option>
    </select>
    <button id="export-seen" class="ghost">Export seen (CSV)</button>
    <button id="clear-seen" class="danger">Clear seen</button>
  </div>
  <table id="table-seen">
    <thead>
      <tr><th>Title</th><th>Company</th><th>Workplace</th><th>City</th><th>Seen</th><th>Status</th><th>First seen</th><th>Last seen</th><th>jobIds</th><th>Description (excerpt)</th><th></th></tr>
    </thead>
    <tbody id="rows-seen"></tbody>
  </table>

  <script type="module" src="options.js"></script>

  <!-- Job preview modal -->
  <div id="preview-modal" class="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__card">
      <button class="modal__close" id="preview-close" title="Close (Esc)">✕</button>
      <div id="preview-content"></div>
    </div>
  </div>
</body>
</html>
