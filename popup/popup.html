<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinkedIn Job Saver</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>LinkedIn Job Saver</h1>
    <div class="count" id="count">0 jobs</div>
  </header>

  <div class="tabs">
    <button class="tab tab--active" data-tab="saved">Saved (<span id="saved-n">0</span>)</button>
    <button class="tab" data-tab="seen">Seen (<span id="seen-n">0</span>)</button>
    <button class="tab" data-tab="backup">Backup</button>
  </div>

  <div class="toolbar" id="toolbar-list">
    <input id="search" type="search" placeholder="Search by title / company…" />
    <button id="export-json">Export JSON</button>
    <button id="export-csv">Export CSV</button>
    <button id="open-options">Options</button>
  </div>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden></p>

  <!-- Backup panel -->
  <div id="panel-backup" class="panel" hidden>
    <div class="backup-row">
      <label class="switch">
        <input type="checkbox" id="auto-backup" />
        <span>Auto-backup after every change</span>
      </label>
    </div>
    <div class="backup-row">
      <label>File mode:</label>
      <select id="backup-mode">
        <option value="overwrite">Overwrite "linkedin-jobs-latest.json"</option>
        <option value="timestamp">Sequential timestamped files</option>
      </select>
    </div>
    <div class="backup-status" id="backup-status">Loading…</div>
    <div class="backup-actions">
      <button id="backup-now">Back up now</button>
      <button id="import-btn" class="ghost">Load from file</button>
      <input id="import-file" type="file" accept="application/json" hidden />
    </div>
    <p class="hint">Files are saved to <code>Downloads/linkedin-jobs-backup/</code>. Use "Load from file" to restore the database (e.g. after reinstall).</p>
  </div>

  <template id="row-tpl">
    <li class="row">
      <div class="row__head">
        <a class="row__title" target="_blank" rel="noopener"></a>
        <span class="row__company"></span>
      </div>
      <div class="row__meta">
        <span class="row__loc"></span>
        <span class="row__date"></span>
      </div>
      <div class="row__desc"></div>
      <div class="row__actions">
        <button class="row__copy">Copy content</button>
        <button class="row__delete">Delete</button>
      </div>
    </li>
  </template>

  <template id="seen-row-tpl">
    <li class="row row--seen">
      <div class="row__head">
        <span class="row__title" style="cursor:default"></span>
        <span class="row__company"></span>
      </div>
      <div class="row__meta">
        <span class="row__seen-count"></span>
        <span class="row__first"></span>
        <span class="row__last"></span>
      </div>
      <div class="row__ids"></div>
      <div class="row__desc"></div>
      <div class="row__actions">
        <button class="row__copy-seen">Copy content</button>
        <button class="row__forget">Forget</button>
      </div>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
